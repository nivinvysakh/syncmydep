name: 'SyncMyDep - Dependency Sync & PR'
description: 'Auto-sync package.json & lockfiles, fix vulnerabilities, and create PRs across npm, yarn, pnpm, bun, and deno.'
author: 'Nivinvysakh'
branding:
  icon: 'git-pull-request'
  color: 'purple'

inputs:
  github-token:
    description: 'GitHub token for creating PRs and pushing branches (GITHUB_TOKEN or PAT).'
    required: false
    default: ${{ github.token }}
  package-manager:
    description: 'Package manager to use: "auto", "npm", "yarn", "pnpm", "bun", or "deno".'
    required: false
    default: 'auto'
  working-directory:
    description: 'Working directory containing package.json / deno.json and lockfiles.'
    required: false
    default: '.'
  config-file:
    description: 'Optional path to .syncmydep.yml configuration file.'
    required: false
    default: ''
  sync-lockfile:
    description: 'Whether to synchronize lockfile with package specifications.'
    required: false
    default: 'true'
  fix-audit:
    description: 'Whether to automatically fix security vulnerabilities with audit fix.'
    required: false
    default: 'true'
  audit-level:
    description: 'Minimum vulnerability level to fix/report: "low", "moderate", "high", "critical".'
    required: false
    default: 'moderate'
  check-only:
    description: 'Dry-run CI gating mode that emits step annotations and exits with code 1 on desync/vulnerabilities.'
    required: false
    default: 'false'
  direct-push:
    description: 'Whether to commit and push directly to open pull request branches when triggered on pull_request.'
    required: false
    default: 'false'
  pr-branch:
    description: 'Branch name to create or update for the Pull Request.'
    required: false
    default: 'syncmydep/dependency-fix'
  pr-title:
    description: 'Title for the generated Pull Request.'
    required: false
    default: 'chore(deps): synchronize package.json and lockfile issues'
  commit-message:
    description: 'Commit message for the dependency update.'
    required: false
    default: 'chore(deps): synchronize package.json and lockfile issues'
  pr-labels:
    description: 'Comma-separated labels to attach to the Pull Request.'
    required: false
    default: 'dependencies, automated-pr'
  pr-assignees:
    description: 'Comma-separated GitHub usernames to assign to the PR.'
    required: false
    default: ''
  pr-reviewers:
    description: 'Comma-separated GitHub usernames to request review from.'
    required: false
    default: ''
  comment-trigger:
    description: 'Comment keyword that triggers dependency synchronization on a PR (e.g. "syncdep" or "/syncdep").'
    required: false
    default: 'syncdep'
  require-owner:
    description: 'Whether only repository owners/maintainers are allowed to trigger dependency fixes via comment ("true" or "false").'
    required: false
    default: 'true'
  verify-lockfile:
    description: 'Whether to run a dry-run frozen installation check on the generated lockfile before committing.'
    required: false
    default: 'true'
  run-build:
    description: 'Optional build smoke test command (e.g. "npm run build") to verify before opening PR.'
    required: false
    default: ''
  fail-on-build-error:
    description: 'Whether to fail and abort if the build smoke test encounters an error ("true" or "false").'
    required: false
    default: 'false'
  auto-merge:
    description: 'Whether to enable GitHub native auto-merge once CI status checks pass ("true" or "false").'
    required: false
    default: 'false'
  auto-merge-method:
    description: 'Merge method for auto-merge: "squash", "merge", or "rebase".'
    required: false
    default: 'squash'

outputs:
  changes-detected:
    description: 'Whether any dependency or lockfile changes were detected and resolved ("true" or "false").'
  pull-request-number:
    description: 'The number of the created or updated Pull Request.'
  pull-request-url:
    description: 'The URL of the created or updated Pull Request.'
  modified-files:
    description: 'Comma-separated list of modified files.'

runs:
  using: 'node20'
  main: 'dist/index.js'
