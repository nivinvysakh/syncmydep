name: Sync Dependencies & Check Lockfile

on:
  schedule:
    # Run every Monday at 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:
  push:
    paths:
      - 'package.json'
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync-dependencies:
    name: Check & Fix Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Run SyncMyDep Action
        id: syncmydep
        uses: nivinvysakh/syncmydep@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          package-manager: 'auto'
          sync-lockfile: 'true'
          fix-audit: 'true'
          audit-level: 'moderate'
          pr-branch: 'syncmydep/dependency-fix'
          pr-title: 'chore(deps): synchronize package.json and lockfile'
          commit-message: 'chore(deps): synchronize package.json and lockfile'
          pr-labels: 'dependencies, automated-pr'

      - name: Log Action Output
        if: steps.syncmydep.outputs.changes-detected == 'true'
        run: |
          echo "Pull Request opened: ${{ steps.syncmydep.outputs.pull-request-url }}"
