name: Auto Assign Reviewer

on:
  pull_request_target:
    types: [opened, ready_for_review]
  workflow_dispatch:
    inputs:
      pull_number:
        description: 'PR number to test assignment on'
        required: false
        default: '19'

permissions:
  pull-requests: write
  issues: write

jobs:
  assign-reviewer:
    runs-on: ubuntu-latest
    steps:
      - name: Request Review & Assign
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request
              ? context.payload.pull_request.number
              : parseInt(context.payload.inputs?.pull_number || '19', 10);

            const team = ['nivinvysakh', 'maneeeeth'];
            const prAuthor = context.payload.pull_request?.user?.login;
            
            // Assign team members (excluding author if PR was created by a team member)
            const candidates = team.filter(user => user.toLowerCase() !== prAuthor?.toLowerCase());

            core.info(`Assigning and requesting review for PR #${prNumber} to: ${candidates.join(', ')}...`);

            // 1. Request review from team members
            try {
              await github.rest.pulls.requestReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                reviewers: candidates
              });
              core.info(`✅ Successfully requested review from: ${candidates.join(', ')}`);
            } catch (err) {
              core.warning(`Review request error: ${err.message}`);
            }

            // 2. Add as Assignees
            try {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                assignees: candidates
              });
              core.info(`✅ Successfully assigned: ${candidates.join(', ')}`);
            } catch (err) {
              core.warning(`Assignee error: ${err.message}`);
            }