name: SyncMyDep on PR Comment

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync-pr-comment:
    name: Sync Dependencies on PR Comment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run SyncMyDep
        uses: ./ # Or nivinvysakh/syncmydep@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-trigger: 'syncdep'
          require-owner: 'true'
          sync-lockfile: 'true'
          fix-audit: 'true'
