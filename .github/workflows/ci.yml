name: CI

on:
  push:
    branches: [main, Beta]
  pull_request:
    branches: [main, Beta]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Run Jest tests
        run: npm test

      - name: Build action dist
        run: npm run build

      - name: Check for uncommitted dist changes
        run: |
          git diff --ignore-space-at-eol --exit-code dist/ dist-cli/ || (echo "Error: dist/ or dist-cli/ is out of date. Please run 'npm run build' and commit changes." && git diff dist/ dist-cli/ && exit 1)