name: CI

on:
  push:
    branches: [main, Beta]
  pull_request:
    branches: [main, Beta]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Run Jest tests
        run: npm test

      - name: Build action dist
        run: npm run build

      - name: Check for uncommitted dist changes
        if: matrix.os == 'ubuntu-latest'
        run: |
          git diff --ignore-space-at-eol --exit-code dist/ || (echo "Error: dist/ is out of date. Please run 'npm run build' and commit changes." && git diff dist/ && exit 1)
